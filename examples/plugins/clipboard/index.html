<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clipboard Manager</title>
  <style>
    :root {
      --bg: #1e1e22;
      --surface: rgba(255, 255, 255, 0.06);
      --surface-hover: rgba(255, 255, 255, 0.10);
      --border: rgba(255, 255, 255, 0.10);
      --text: #f2f2f4;
      --muted: rgba(242, 242, 244, 0.55);
      --accent: #007aff;
      --danger: #ff3b30;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f5f5f7;
        --surface: rgba(0, 0, 0, 0.04);
        --surface-hover: rgba(0, 0, 0, 0.08);
        --border: rgba(0, 0, 0, 0.10);
        --text: #1d1d1f;
        --muted: rgba(29, 29, 31, 0.55);
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 10px;
      -webkit-user-select: none;
      user-select: none;
    }
    h1 { font-size: 14px; margin: 0; font-weight: 600; }
    .row { display: flex; gap: 8px; }
    button {
      font: inherit;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 6px 10px;
      cursor: pointer;
      transition: background 0.12s;
      white-space: nowrap;
    }
    button:hover:not(:disabled) { background: var(--surface-hover); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button.primary { background: var(--accent); border-color: transparent; color: #fff; }
    button.primary:hover { background: #0a84ff; }
    button.danger { color: var(--danger); }
    textarea {
      font: inherit;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 8px;
      resize: none;
      width: 100%;
      min-height: 52px;
      -webkit-user-select: text;
      user-select: text;
    }
    .toolbar { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
    .toolbar-left { display: flex; gap: 8px; }
    .list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none; }
    .item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    .item-text {
      flex: 1;
      min-width: 0;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 3.6em;
      overflow: hidden;
      -webkit-user-select: text;
      user-select: text;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
    }
    .item-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .item-actions button { padding: 4px 8px; font-size: 12px; }
    .empty { color: var(--muted); text-align: center; padding: 24px 8px; }
    .toast {
      position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
      background: var(--text); color: var(--bg);
      padding: 6px 12px; border-radius: 999px; font-size: 12px;
      opacity: 0; transition: opacity 0.2s; pointer-events: none;
    }
    .toast.show { opacity: 0.95; }
    .count { color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <h1>Clipboard Manager</h1>

  <div class="row">
    <button id="grab" class="primary" style="flex:1">Save current clipboard</button>
  </div>

  <textarea id="entry" placeholder="…or type/paste text here, then Save text"></textarea>
  <div class="row">
    <button id="save-text" style="flex:1">Save text</button>
  </div>

  <div class="toolbar">
    <span class="count" id="count">0 saved</span>
    <button id="clear" class="danger">Clear all</button>
  </div>

  <ul class="list" id="list"></ul>

  <div class="toast" id="toast"></div>

  <script>
    const STORE_KEY = "history";
    const MAX_ITEMS = 100;

    const $ = (id) => document.getElementById(id);
    const listEl = $("list");
    const countEl = $("count");
    const toastEl = $("toast");

    let history = [];
    let confirmingClear = false;

    function toast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => toastEl.classList.remove("show"), 1400);
    }

    async function load() {
      try {
        history = (await window.ani.storage.get(STORE_KEY)) || [];
        if (!Array.isArray(history)) history = [];
      } catch (e) {
        history = [];
      }
      render();
    }

    async function persist() {
      try {
        await window.ani.storage.set(STORE_KEY, history);
      } catch (e) {
        toast("Could not save");
      }
    }

    function addEntry(text) {
      const trimmed = (text || "").replace(/\s+$/g, "");
      if (!trimmed.trim()) {
        toast("Nothing to save");
        return false;
      }
      // Skip if identical to the most recent entry.
      if (history[0] && history[0].text === trimmed) {
        toast("Already at top");
        return false;
      }
      history.unshift({ id: String(Date.now()) + Math.random().toString(16).slice(2), text: trimmed });
      if (history.length > MAX_ITEMS) history.length = MAX_ITEMS;
      persist();
      render();
      return true;
    }

    async function grabClipboard() {
      try {
        const text = await navigator.clipboard.readText();
        if (addEntry(text)) toast("Saved from clipboard");
      } catch (e) {
        toast("Can't read clipboard — paste into the box below");
        $("entry").focus();
      }
    }

    async function copyOut(text) {
      try {
        await navigator.clipboard.writeText(text);
        toast("Copied to clipboard");
      } catch (e) {
        toast("Copy failed");
      }
    }

    function removeItem(id) {
      history = history.filter((h) => h.id !== id);
      persist();
      render();
    }

    function render() {
      countEl.textContent = history.length + (history.length === 1 ? " saved" : " saved");
      listEl.innerHTML = "";

      if (history.length === 0) {
        const li = document.createElement("li");
        li.className = "empty";
        li.textContent = "No snippets yet. Copy something, then “Save current clipboard”.";
        listEl.appendChild(li);
        return;
      }

      for (const item of history) {
        const li = document.createElement("li");
        li.className = "item";

        const txt = document.createElement("div");
        txt.className = "item-text";
        txt.textContent = item.text;

        const actions = document.createElement("div");
        actions.className = "item-actions";

        const copyBtn = document.createElement("button");
        copyBtn.textContent = "Copy";
        copyBtn.addEventListener("click", () => copyOut(item.text));

        const delBtn = document.createElement("button");
        delBtn.className = "danger";
        delBtn.textContent = "✕";
        delBtn.title = "Delete";
        delBtn.addEventListener("click", () => removeItem(item.id));

        actions.appendChild(copyBtn);
        actions.appendChild(delBtn);
        li.appendChild(txt);
        li.appendChild(actions);
        listEl.appendChild(li);
      }
    }

    $("grab").addEventListener("click", grabClipboard);

    $("save-text").addEventListener("click", () => {
      const el = $("entry");
      if (addEntry(el.value)) {
        el.value = "";
        toast("Saved");
      }
    });

    $("clear").addEventListener("click", () => {
      if (history.length === 0) return;
      if (!confirmingClear) {
        confirmingClear = true;
        $("clear").textContent = "Confirm clear?";
        setTimeout(() => {
          confirmingClear = false;
          $("clear").textContent = "Clear all";
        }, 2500);
        return;
      }
      confirmingClear = false;
      $("clear").textContent = "Clear all";
      history = [];
      persist();
      render();
      toast("Cleared");
    });

    load();
  </script>
</body>
</html>
